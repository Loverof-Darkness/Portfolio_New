name: Temporary Portfolio Update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-portfolio:
    if: ${{ !contains(github.event.head_commit.message, '[portfolio-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refine Scientific Arsenal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          script = Path('script.js')
          text = script.read_text()

          new_function = r'''
function injectScientificArsenalSection() {
  if (document.getElementById('arsenal')) return;
  const content = document.querySelector('.content');
  if (!content) return;

  const instruments = [
    'HPLC',
    'UPLC',
    'Ion Chromatography',
    'IR',
    'UV-Visible Spectrophotometer',
    'Zeta Sizer',
    'DSC',
    'TGA',
    'Viscometer',
    'pH meter',
    'Osmometer',
    'Other Wet Chemical Techniques',
  ];

  const arsenal = document.createElement('section');
  arsenal.id = 'arsenal';
  arsenal.className = 'arsenal-panel';
  arsenal.innerHTML = `
    <div class="arsenal-header-wrap">
      <h2 class="arsenal-heading">INSTRUMENTS HANDLED</h2>
    </div>
    <div class="arsenal-orbit" role="list" aria-label="Analytical instruments handled">
      ${instruments.map((name, index) => `
        <button class="arsenal-item" style="--i:${index}" type="button" role="listitem" aria-label="${name}">
          <span class="arsenal-number">${String(index + 1).padStart(2, '0')}</span>
          <span class="arsenal-name">${name}</span>
        </button>
      `).join('')}
    </div>
  `;
  content.appendChild(arsenal);

  const items = [...arsenal.querySelectorAll('.arsenal-item')];
  items.forEach((item) => {
    const activate = () => {
      items.forEach((node) => node.classList.remove('is-selected'));
      item.classList.add('is-selected');
    };
    item.addEventListener('mouseenter', activate);
    item.addEventListener('focus', activate);
    item.addEventListener('click', activate);
  });

  const style = document.createElement('style');
  style.id = 'arsenal-runtime-styles';
  style.textContent = `
    body.home-active .arsenal-panel, body.about-active .arsenal-panel, body.experience-active .arsenal-panel { display:none!important; }
    body.arsenal-active .hero, body.arsenal-active .about-panel, body.arsenal-active .experience-panel { display:none!important; }

    .arsenal-panel {
      min-height:100vh;
      height:100vh;
      overflow:auto;
      scroll-snap-align:start;
      scroll-snap-stop:always;
      padding:38px 0 34px;
      display:flex;
      flex-direction:column;
      gap:28px;
    }

    .arsenal-header-wrap {
      text-align:left;
      margin:0;
      max-width:900px;
    }
    .arsenal-heading {
      margin:0;
      font-size:clamp(42px,5vw,68px);
      line-height:.95;
      letter-spacing:-.045em;
      font-weight:900;
      background:linear-gradient(90deg,#fff 0%,#00e5ff 46%,#8b5cf6 100%);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      text-shadow:0 0 24px rgba(0,229,255,.13);
    }

    .arsenal-orbit {
      position:relative;
      width:100%;
      min-height:0;
      max-height:none;
      flex:1 1 auto;
      margin:0;
      padding:18px 14px 24px;
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      grid-template-rows:repeat(3,minmax(120px,1fr));
      gap:20px 24px;
      border:0;
      border-radius:0;
      background:none;
      box-shadow:none;
    }
    .arsenal-orbit::before,
    .arsenal-orbit::after,
    .arsenal-core {
      display:none!important;
    }

    .arsenal-item {
      position:relative;
      left:auto;
      top:auto;
      width:100%;
      min-height:118px;
      padding:20px 18px;
      margin:0;
      transform:none!important;
      border:1px solid rgba(0,229,255,.3);
      border-radius:16px;
      background:rgba(2,9,14,.84);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      color:#ecf8ff;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:8px;
      cursor:pointer;
      opacity:0;
      animation:arsenalCardIn .72s cubic-bezier(.2,.8,.2,1) forwards;
      animation-delay:calc(var(--i) * 220ms);
      transition:border-color .22s ease, box-shadow .22s ease, background .22s ease;
      box-shadow:0 0 18px rgba(0,229,255,.035);
      z-index:1;
    }

    .arsenal-item:nth-child(1){grid-column:1;grid-row:1}
    .arsenal-item:nth-child(2){grid-column:2;grid-row:1}
    .arsenal-item:nth-child(3){grid-column:3;grid-row:1}
    .arsenal-item:nth-child(4){grid-column:4;grid-row:1}
    .arsenal-item:nth-child(5){grid-column:4;grid-row:2}
    .arsenal-item:nth-child(6){grid-column:3;grid-row:2}
    .arsenal-item:nth-child(7){grid-column:2;grid-row:2}
    .arsenal-item:nth-child(8){grid-column:1;grid-row:2}
    .arsenal-item:nth-child(9){grid-column:1;grid-row:3}
    .arsenal-item:nth-child(10){grid-column:2;grid-row:3}
    .arsenal-item:nth-child(11){grid-column:3;grid-row:3}
    .arsenal-item:nth-child(12){grid-column:4;grid-row:3}

    .arsenal-item:hover,
    .arsenal-item:focus-visible,
    .arsenal-item.is-selected {
      transform:translateY(-3px)!important;
      border-color:rgba(0,229,255,.86);
      background:rgba(3,15,22,.93);
      box-shadow:0 0 28px rgba(0,229,255,.16), inset 0 0 22px rgba(139,92,246,.08);
      outline:none;
    }

    .arsenal-number {
      display:block;
      color:#00e5ff;
      font:900 18px ui-monospace,monospace;
      letter-spacing:.08em;
      line-height:1;
    }
    .arsenal-name {
      display:block;
      max-width:100%;
      color:#f3f8ff;
      font-size:18px;
      font-weight:900;
      line-height:1.18;
      text-align:center;
      letter-spacing:.01em;
    }

    @keyframes arsenalCardIn {
      from { opacity:0; transform:translateY(24px) scale(.92); }
      to { opacity:1; transform:translateY(0) scale(1); }
    }

    @media(max-width:900px){
      .arsenal-panel{padding-top:32px;gap:22px}
      .arsenal-heading{font-size:48px}
      .arsenal-orbit{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,minmax(105px,1fr));gap:16px}
      .arsenal-item:nth-child(1){grid-column:1;grid-row:1}
      .arsenal-item:nth-child(2){grid-column:2;grid-row:1}
      .arsenal-item:nth-child(3){grid-column:3;grid-row:1}
      .arsenal-item:nth-child(4){grid-column:3;grid-row:2}
      .arsenal-item:nth-child(5){grid-column:2;grid-row:2}
      .arsenal-item:nth-child(6){grid-column:1;grid-row:2}
      .arsenal-item:nth-child(7){grid-column:1;grid-row:3}
      .arsenal-item:nth-child(8){grid-column:2;grid-row:3}
      .arsenal-item:nth-child(9){grid-column:3;grid-row:3}
      .arsenal-item:nth-child(10){grid-column:3;grid-row:4}
      .arsenal-item:nth-child(11){grid-column:2;grid-row:4}
      .arsenal-item:nth-child(12){grid-column:1;grid-row:4}
      .arsenal-name{font-size:16px}
    }

    @media(max-width:600px){
      .arsenal-panel{height:auto;min-height:100vh;padding:26px 0}
      .arsenal-heading{font-size:40px}
      .arsenal-orbit{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(6,minmax(90px,1fr));padding:4px 0 10px;gap:14px}
      .arsenal-item{min-height:88px;padding:16px 12px}
      .arsenal-item:nth-child(1){grid-column:1;grid-row:1}
      .arsenal-item:nth-child(2){grid-column:2;grid-row:1}
      .arsenal-item:nth-child(3){grid-column:2;grid-row:2}
      .arsenal-item:nth-child(4){grid-column:1;grid-row:2}
      .arsenal-item:nth-child(5){grid-column:1;grid-row:3}
      .arsenal-item:nth-child(6){grid-column:2;grid-row:3}
      .arsenal-item:nth-child(7){grid-column:2;grid-row:4}
      .arsenal-item:nth-child(8){grid-column:1;grid-row:4}
      .arsenal-item:nth-child(9){grid-column:1;grid-row:5}
      .arsenal-item:nth-child(10){grid-column:2;grid-row:5}
      .arsenal-item:nth-child(11){grid-column:2;grid-row:6}
      .arsenal-item:nth-child(12){grid-column:1;grid-row:6}
      .arsenal-number{font-size:16px}
      .arsenal-name{font-size:14px}
    }
  `;
  document.head.appendChild(style);
}
'''

          text = re.sub(r'function injectScientificArsenalSection\(\) \{.*?\n\}\n\nfunction setView', new_function + '\n\nfunction setView', text, count=1, flags=re.S)
          script.write_text(text)

          css = Path('style.css')
          css_text = css.read_text()
          css_text += r'''

/* Final Scientific Arsenal layout override */
.arsenal-panel .arsenal-icon,
.arsenal-panel .arsenal-core,
.arsenal-panel .arsenal-orbit::before,
.arsenal-panel .arsenal-orbit::after { display:none!important; }
.arsenal-panel .arsenal-header-wrap { text-align:left!important; margin-left:0!important; }
'''
          css.write_text(css_text)

          wf = Path('.github/workflows/temporary-arsenal-update.yml')
          wf.unlink(missing_ok=True)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js style.css .github/workflows/temporary-arsenal-update.yml
          git diff --cached --quiet && exit 0
          git commit -m "Refine Scientific Arsenal layout [portfolio-auto]"
          git push
