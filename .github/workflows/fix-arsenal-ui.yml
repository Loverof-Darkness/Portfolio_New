name: Fix Scientific Arsenal UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[portfolio-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text()

          old = '''  const symbols = ['⌁','◈','⊕','IR','UV','ζ','Δ','TGA','η','pH','Ω','∿'];\n'''
          s = s.replace(old, '')

          old = '''          <span class="arsenal-icon">${symbols[index]}</span>\n          <span class="arsenal-name">${name}</span>'''
          new = '''          <span class="arsenal-name">${index + 1}. ${name}</span>'''
          s = s.replace(old, new)

          old_css = '''    .arsenal-header-wrap{text-align:center;margin:0 auto}.arsenal-heading{margin:0;font-size:clamp(48px,5.8vw,78px);line-height:.92;letter-spacing:-.05em;font-weight:900;background:linear-gradient(90deg,#fff 0%,#00e5ff 45%,#8b5cf6 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 26px rgba(0,229,255,.14)}\n'''
          new_css = '''    .arsenal-header-wrap{align-self:stretch;text-align:left;margin:0}.arsenal-heading{margin:0;font-size:clamp(48px,5.4vw,72px);line-height:.92;letter-spacing:-.05em;font-weight:900;background:linear-gradient(90deg,#fff 0%,#00e5ff 45%,#8b5cf6 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 26px rgba(0,229,255,.14)}\n'''
          s = s.replace(old_css, new_css)

          old_css = '''    .arsenal-name{max-width:108px;color:#d7e4ef;font-size:11px;font-weight:800;line-height:1.12;text-align:center}\n'''
          new_css = '''    .arsenal-name{max-width:118px;color:#d7e4ef;font-size:13px;font-weight:850;line-height:1.2;text-align:center}\n'''
          s = s.replace(old_css, new_css)

          old_css = '''    .arsenal-item{--angle:calc((var(--i)*30deg) - 90deg);position:absolute;left:50%;top:50%;width:126px;min-height:92px;padding:10px 8px;transform:translate(-50%,-50%) rotate(var(--angle)) translateY(calc(min(34vw,285px)*-1)) rotate(calc(var(--angle)*-1));border:1px solid rgba(0,229,255,.28);border-radius:18px;background:rgba(2,9,14,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#ecf8ff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;opacity:0;animation:arsenalIn .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*90ms);transition:.25s ease;box-shadow:0 0 18px rgba(0,229,255,.04);z-index:3}.arsenal-item:hover,.arsenal-item:focus-visible,.arsenal-item.is-selected{transform:translate(-50%,-50%) rotate(var(--angle)) translateY(calc(min(34vw,285px)*-1)) rotate(calc(var(--angle)*-1)) scale(1.07);border-color:rgba(0,229,255,.85);box-shadow:0 0 25px rgba(0,229,255,.15),inset 0 0 20px rgba(139,92,246,.08);outline:none}.arsenal-number{color:#00e5ff;font:900 11px ui-monospace,monospace}.arsenal-icon{font:900 21px Georgia,serif;color:#dffaff}.arsenal-name{max-width:108px;color:#d7e4ef;font-size:11px;font-weight:800;line-height:1.12;text-align:center}\n'''
          new_css = '''    .arsenal-item{--angle:calc((var(--i)*30deg) - 90deg);position:absolute;left:50%;top:50%;width:148px;min-height:86px;padding:12px 10px;transform:translate(-50%,-50%) rotate(var(--angle)) translateY(calc(min(34vw,285px)*-1)) rotate(calc(var(--angle)*-1));border:1px solid rgba(0,229,255,.28);border-radius:18px;background:rgba(2,9,14,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#ecf8ff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;opacity:0;animation:arsenalIn .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*650ms);transition:.25s ease;box-shadow:0 0 18px rgba(0,229,255,.04);z-index:3}.arsenal-item:hover,.arsenal-item:focus-visible,.arsenal-item.is-selected{transform:translate(-50%,-50%) rotate(var(--angle)) translateY(calc(min(34vw,285px)*-1)) rotate(calc(var(--angle)*-1)) scale(1.07);border-color:rgba(0,229,255,.85);box-shadow:0 0 25px rgba(0,229,255,.15),inset 0 0 20px rgba(139,92,246,.08);outline:none}.arsenal-number{display:none}.arsenal-name{max-width:130px;color:#d7e4ef;font-size:13px;font-weight:850;line-height:1.2;text-align:center}\n'''
          s = s.replace(old_css, new_css)

          p.write_text(s)

          css = Path('style.css')
          c = css.read_text()
          c += '''\n/* Arsenal heading + sequential tile refinements */\nbody.arsenal-active .arsenal-header-wrap{align-self:stretch;text-align:left;margin:0}\nbody.arsenal-active .arsenal-heading{font-size:clamp(48px,5.4vw,72px)!important}\nbody.arsenal-active .arsenal-name{font-size:13px;font-weight:850}\nbody.arsenal-active .arsenal-icon,body.arsenal-active .arsenal-number{display:none!important}\nbody.arsenal-active .arsenal-item{animation-delay:calc(var(--i) * 650ms)!important;width:148px;min-height:86px}\n@media(max-width:760px){body.arsenal-active .arsenal-header-wrap{text-align:left}body.arsenal-active .arsenal-heading{font-size:44px!important}body.arsenal-active .arsenal-item{width:142px;animation-delay:calc(var(--i) * 550ms)!important}}\n'''
          css.write_text(c)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-arsenal-ui.yml
          git add script.js style.css
          git commit -m "Refine Scientific Arsenal tiles [portfolio-auto]"
          git push
