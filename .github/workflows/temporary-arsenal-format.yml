name: Temporary Arsenal Format

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format-arsenal:
    if: ${{ !contains(github.event.head_commit.message, '[portfolio-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format Arsenal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('script.js')
          s = p.read_text()

          s = re.sub(r"\n  const symbols = \[[^\n]*\];", "", s, count=1)
          s = s.replace("<span class=\"arsenal-number\">${String(index + 1).padStart(2, '0')}</span>\n          <span class=\"arsenal-icon\">${symbols[index]}</span>\n          <span class=\"arsenal-name\">${name}</span>", "<span class=\"arsenal-number\">${index + 1}.</span>\n          <span class=\"arsenal-name\">${name}</span>")
          s = s.replace("animation-delay: calc(var(--i) * 90ms);", "animation-delay: calc(var(--i) * 420ms);")
          s = s.replace(".arsenal-item { width:126px;", ".arsenal-item { width:132px;")
          s = s.replace(".arsenal-number { color:#00e5ff; font:900 11px ui-monospace,monospace; letter-spacing:.08em; }\n.arsenal-icon { font:900 21px Georgia,serif; color:#dffaff; }\n.arsenal-name {", ".arsenal-number { color:#00e5ff; font:900 15px ui-monospace,monospace; letter-spacing:.06em; }\n.arsenal-name {")
          s = s.replace(".arsenal-name { max-width:108px;", ".arsenal-name { max-width:118px;")
          s = s.replace("@keyframes arsenalIn { from { opacity: 0;", "@keyframes arsenalIn { from { opacity: 0;")
          s = s.replace("@keyframes arsenalIn { from { opacity:0;", "@keyframes arsenalIn { from { opacity:0;")
          s = re.sub(r"animation-delay: calc\(var\(--i\) \* 90ms\);", "animation-delay: calc(var(--i) * 420ms);", s)
          s = s.replace(".arsenal-icon { font:900 21px Georgia,serif; color:#dffaff; }\n", "")
          s = s.replace(".arsenal-item { width:126px;", ".arsenal-item { width:132px;")

          p.write_text(s)

          css = Path('style.css')
          c = css.read_text()
          extra = """
/* Scientific Arsenal sequential presentation */
.arsenal-item { animation-duration: .8s !important; }
.arsenal-number { font-size: 15px !important; }
.arsenal-name { font-size: 13px !important; max-width: 118px !important; }
.arsenal-icon { display:none !important; }
"""
          if '/* Scientific Arsenal sequential presentation */' not in c:
              css.write_text(c + extra)

          wf = Path('.github/workflows/temporary-arsenal-format.yml')
          wf.unlink(missing_ok=True)

          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js style.css .github/workflows/temporary-arsenal-format.yml
          git diff --cached --quiet && exit 0
          git commit -m "Format Scientific Arsenal items [portfolio-auto]"
          git push
