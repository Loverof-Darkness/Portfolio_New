name: Switch to corrected Scientific Arsenal renderer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  switch:
    if: ${{ !contains(github.event.head_commit.message, '[portfolio-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch script reference
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          text = text.replace('./arsenal-rewrite.js?v=1', './arsenal-rewrite2.js?v=1')
          tag_old = '<script src="./arsenal-rewrite.js?v=1" defer></script>'
          tag_new = '<script src="./arsenal-rewrite2.js?v=1" defer></script>'
          if tag_old in text:
              text = text.replace(tag_old, tag_new)
          elif tag_new not in text:
              text = text.replace('</body>', '  ' + tag_new + '\n</body>')
          p.write_text(text)
          PY

          rm -f .github/workflows/force-arsenal-rewrite.yml \
                .github/workflows/switch-arsenal-script.yml \
                .github/workflows/temporary-arsenal-update.yml \
                .github/workflows/temporary-arsenal-format.yml \
                .github/workflows/arsenal-refine.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows
          git diff --cached --quiet || {
            git commit -m "Use corrected Scientific Arsenal renderer [portfolio-auto]"
            git push
          }
