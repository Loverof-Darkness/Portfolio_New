name: Fix Scientific Arsenal

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-arsenal:
    if: ${{ !contains(github.event.head_commit.message, '[arsenal-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply arsenal fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('script.js')
          s = p.read_text()

          s = s.replace("  const symbols = ['⌁','◈','⊕','IR','UV','ζ','Δ','TGA','η','pH','Ω','∿'];\n", "")

          s = s.replace('''          <span class="arsenal-number">${String(index + 1).padStart(2,'0')}</span>\n          <span class="arsenal-icon">${symbols[index]}</span>\n          <span class="arsenal-name">${name}</span>''', '''          <span class="arsenal-number">${index + 1}.</span>\n          <span class="arsenal-name">${name}</span>''')

          s = s.replace('''    .arsenal-item{--angle:calc((var(--i)*30deg) - 90deg);''', '''    .arsenal-item{--angle:calc(var(--i)*30deg);''')
          s = s.replace('''    .arsenal-item{--angle:calc((var(--i)*30deg)-90deg);''', '''    .arsenal-item{--angle:calc(var(--i)*30deg);''')
          s = s.replace('animation-delay:calc(var(--i)*90ms);', 'animation-delay:calc(var(--i)*650ms);')

          s = s.replace('''.arsenal-icon{font:900 21px Georgia,serif;color:#dffaff}.arsenal-name{max-width:108px;color:#d7e4ef;font-size:11px;font-weight:800;line-height:1.12;text-align:center}''', '''.arsenal-name{max-width:115px;color:#dff7ff;font-size:14px;font-weight:850;line-height:1.18;text-align:center}''')

          s = s.replace('''.arsenal-number{color:#00e5ff;font:900 11px ui-monospace,monospace}''', '''.arsenal-number{color:#00e5ff;font:900 14px ui-monospace,monospace;letter-spacing:.08em}''')

          s = s.replace('''.arsenal-header-wrap{text-align:center;margin:0 auto}.arsenal-heading{''', '''.arsenal-header-wrap{text-align:left;margin:0}.arsenal-heading{''')

          s = s.replace('''.arsenal-item{width:128px;min-height:74px;transform:translate(-50%,-50%) rotate(var(--angle)) translateY(-275px) rotate(calc(var(--angle)*-1))}''', '''.arsenal-item{width:128px;min-height:74px;transform:translate(-50%,-50%) rotate(var(--angle)) translateY(-275px) rotate(calc(var(--angle)*-1))}''')

          # Ensure a previous icon element cannot remain visible from cached/generated markup.
          s = s.replace('<span class="arsenal-icon">${symbols[index]}</span>', '')

          p.write_text(s)

          css = Path('style.css')
          c = css.read_text()
          extra = '''\n/* Scientific Arsenal: final card cleanup */\n.arsenal-header-wrap{text-align:left!important;margin:0!important}\n.arsenal-item{--angle:calc(var(--i)*30deg)!important;animation-delay:calc(var(--i)*650ms)!important}\n.arsenal-item .arsenal-icon{display:none!important}\n.arsenal-number{font-size:14px!important;letter-spacing:.08em}\n.arsenal-name{font-size:14px!important;font-weight:850!important;line-height:1.18!important;color:#dff7ff!important}\n'''
          if '/* Scientific Arsenal: final card cleanup */' not in c:
              css.write_text(c + extra)

          wf = Path('.github/workflows/fix-arsenal.yml')
          wf.unlink(missing_ok=True)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js style.css .github/workflows/fix-arsenal.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix Scientific Arsenal cards [arsenal-fix]"
          git push
