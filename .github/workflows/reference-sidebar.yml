name: Apply reference sidebar

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply reference sidebar
        run: python3 scripts/style-sidebar.py docs/index.html

      - name: Commit sidebar update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          if git diff --cached --quiet; then
            echo 'No sidebar changes needed.'
            exit 0
          fi
          git commit -m 'Match sidebar to reference design'
          git push
