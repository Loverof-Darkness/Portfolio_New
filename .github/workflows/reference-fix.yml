name: Fix reference build
on:
  push:
    paths:
      - 'docs/index.html'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix arsenal mount point
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text()
          s2 = s.replace('id="arsenal"></div>', 'id="arsenalGrid"></div>')
          s2 = s2.replace("document.getElementById('arsenal');", "document.getElementById('arsenalGrid');")
          if s2 != s:
              p.write_text(s2)
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git commit -m 'Fix scientific arsenal mount point'
          git push