name: Final Scientific Arsenal Grid Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[arsenal-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final grid CSS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          text = index.read_text()
          link = '<link rel="stylesheet" href="./arsenal-fix.css?v=final1" />'
          if 'arsenal-fix.css?v=final1' not in text:
              text = text.replace('</head>', f'  {link}\n</head>', 1)
              index.write_text(text)
          wf = Path('.github/workflows/final-arsenal-grid-fix.yml')
          wf.unlink(missing_ok=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/final-arsenal-grid-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Apply final Scientific Arsenal grid fix [arsenal-final]'
          git push
