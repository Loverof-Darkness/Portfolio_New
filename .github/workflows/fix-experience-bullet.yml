name: Remove obsolete experience bullet

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete bullet and workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text()
          target = '          <li>Apply HPLC/UPLC, IR, UV, DSC and ion chromatography techniques to support analytical development and characterization activities.</li>\n'
          if target in s:
              s = s.replace(target, '', 1)
          p.write_text(s)
          PY
          git rm .github/workflows/fix-experience-bullet.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js
          git commit -m 'fix: remove obsolete experience bullet' || exit 0
          git push
