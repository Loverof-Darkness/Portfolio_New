name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Vendor GalaxyJS runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl -fsSL https://raw.githubusercontent.com/Edwson/GalaxyJS/main/galaxy.min.js \
            -o vendor/galaxy.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.min.js \
            -o vendor/three.module.min.js
          test -s vendor/galaxy.min.js
          test -s vendor/three.module.min.js

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
